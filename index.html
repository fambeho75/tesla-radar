<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Tesla Model Y prices in Sweden: used listings in the south, new prices, private leasing and a 3-year cost comparison.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tesla Radar">
  <title>Tesla Radar</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("myradar-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="icon" href="favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="icon" href="icon-rounded.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <noscript><p class="noscript">Tesla Radar needs JavaScript.</p></noscript>
  <div id="app"></div>
  <script src="radar.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
